<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 137 46" width="137" height="46" role="img" aria-label="LinkedIn">
<defs>
  <filter id="g" x="-10%" y="-40%" width="120%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .t { font: 600 14px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace, 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP'; }
  .ring { animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .55; } }
</style>
<g transform="translate(4 4)">
  <rect width="129" height="38" rx="19.0" fill="#0b0618"/>
  <rect class="ring" x=".75" y=".75" width="127.5" height="36.5" rx="18.25" fill="none" stroke="#00e5ff" stroke-width="1.5" filter="url(#g)"/>
  <g transform="translate(16 10.0)" filter="url(#g)"><rect x="0" y="0" width="18" height="18" rx="4" fill="none" stroke="#00e5ff" stroke-width="1.6"/><text x="9" y="13.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#00e5ff">in</text></g>
  
  <text x="43" y="24.0" class="t" fill="#00e5ff" filter="url(#g)">LinkedIn</text>
</g>
</svg>